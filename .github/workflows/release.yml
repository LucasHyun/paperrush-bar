name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish .zip
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Refresh bundled snapshot
        run: |
          curl -sL https://raw.githubusercontent.com/awsaf49/paperrush/main/js/data.js -o /tmp/data.js
          python3 - <<'PY'
          import json
          js = open('/tmp/data.js').read()
          i = js.index('{', js.index('CONFERENCES_DATA'))
          obj, _ = json.JSONDecoder().raw_decode(js[i:])
          json.dump(obj, open('Resources/conferences.json', 'w'), ensure_ascii=False, indent=1)
          print('snapshot:', len(obj['conferences']), 'conferences,', obj['lastUpdated'])
          PY

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./build.sh

      - name: Package
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cd build
          # -y keeps symlinks inside the bundle intact
          zip -r -y "PaperRushBar-$TAG.zip" PaperRushBar.app
          shasum -a 256 "PaperRushBar-$TAG.zip" | tee "PaperRushBar-$TAG.zip.sha256"

      - name: Render the Homebrew cask
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 "build/PaperRushBar-$TAG.zip" | cut -d' ' -f1)"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
              packaging/Casks/paperrush-bar.rb > "build/paperrush-bar.rb"
          echo "--- rendered cask ---"
          head -4 "build/paperrush-bar.rb"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.sha256
            build/paperrush-bar.rb
          body: |
            ### Install

            1. Download and unzip `PaperRushBar-${{ steps.package.outputs.tag }}.zip`
            2. Move `PaperRushBar.app` to `/Applications`
            3. First launch: right-click → **Open** (the build is ad-hoc signed, not notarized)

            Or build from source:

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd ${{ github.event.repository.name }} && ./build.sh && ./install.sh
            ```

            Requires macOS 13+.

            Homebrew (once the tap is pointed at this release):

            ```bash
            brew tap LucasHyun/tap && brew install --cask paperrush-bar
            ```
