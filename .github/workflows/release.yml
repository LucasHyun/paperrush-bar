name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish .zip
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Refresh bundled snapshot
        run: |
          curl -sL https://raw.githubusercontent.com/awsaf49/paperrush/main/js/data.js -o /tmp/data.js
          python3 - <<'PY'
          import json
          js = open('/tmp/data.js').read()
          i = js.index('{', js.index('CONFERENCES_DATA'))
          obj, _ = json.JSONDecoder().raw_decode(js[i:])
          json.dump(obj, open('Resources/conferences.json', 'w'), ensure_ascii=False, indent=1)
          print('snapshot:', len(obj['conferences']), 'conferences,', obj['lastUpdated'])
          PY

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./build.sh

      - name: Package
        id: package
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cd build
          # -y keeps symlinks inside the bundle intact
          zip -r -y "PaperRushBar-$TAG.zip" PaperRushBar.app
          shasum -a 256 "PaperRushBar-$TAG.zip" | tee "PaperRushBar-$TAG.zip.sha256"

      - name: Render the Homebrew cask
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 "build/PaperRushBar-$TAG.zip" | cut -d' ' -f1)"
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
              packaging/Casks/paperrush-bar.rb > "build/paperrush-bar.rb"
          echo "--- rendered cask ---"
          head -4 "build/paperrush-bar.rb"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: |
            build/*.zip
            build/*.sha256
            build/paperrush-bar.rb
          body: |
            ### Install

            1. Download and unzip `PaperRushBar-${{ steps.package.outputs.tag }}.zip`
            2. Move `PaperRushBar.app` to `/Applications`
            3. First launch: right-click → **Open** (the build is ad-hoc signed, not notarized)

            Or build from source:

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd ${{ github.event.repository.name }} && ./build.sh && ./install.sh
            ```

            Requires macOS 13+.

            Or from the terminal, on any Mac with Python:

            ```bash
            pip install paperrush-bar && paperrush-bar install     # or: uvx paperrush-bar install
            ```

      # Push the rendered cask to the personal tap, when one is configured.
      # TAP_TOKEN: a fine-grained PAT with Contents: read/write on LucasHyun/homebrew-tap.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.package.outputs.tag }}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/LucasHyun/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Casks
          cp build/paperrush-bar.rb /tmp/tap/Casks/paperrush-bar.rb
          cd /tmp/tap
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/paperrush-bar.rb
          git diff --cached --quiet && { echo "tap already current"; exit 0; }
          git commit -m "paperrush-bar ${TAG#v}"
          git push

  # The pip installer shares the app's version number, so it is published from the
  # same tag. Uses PyPI trusted publishing: no token, just the `pypi` environment
  # registered as a publisher on pypi.org (see packaging/README.md).
  pypi:
    name: Publish installer to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"${VERSION}\"/" pypi/pyproject.toml
          grep '^version' pypi/pyproject.toml

      - name: Build sdist and wheel
        run: |
          pip install --quiet build
          python -m build pypi/ --outdir pypi/dist
          ls -l pypi/dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist
          skip-existing: true
