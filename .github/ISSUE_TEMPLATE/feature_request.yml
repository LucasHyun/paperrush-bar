name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation rather than the solution — it often leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the app a menu bar utility (no window, no settings panel sprawl)
        - label: This does not require an Xcode project or a package manager
